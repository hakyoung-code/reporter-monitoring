name: Daily Reporter Monitoring

on:
  schedule:
    # UTC 22:00 = 한국 시간(KST) 매일 아침 07:00
    - cron: '0 22 * * *'
  workflow_dispatch:      # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 2. Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser requests beautifulsoup4 scikit-learn

      - name: 4. 기자 모니터링 및 분석 스크립트 실행
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python main.py
