name: Daily Reporter Monitoring

on:
  schedule:
    # 매일 한국시간 오전 8시(UTC 23시) 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 생성

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Monitoring Script
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_APP_PASSWORD: ${{ secrets.MY_APP_PASSWORD }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }} # Apps Script URL 연결 추가
        run: python main.py
